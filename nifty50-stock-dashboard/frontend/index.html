<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nifty 50 Candlestick Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>Nifty 50 Candlestick Dashboard</h1>
      <p>Select a company to load 1 year candlestick data.</p>
    </header>

    <section class="controls">
      <label for="stockSelect">Choose a stock</label>
      <select id="stockSelect">
        <option value="">Loading stocks...</option>
      </select>
      <button id="loadBtn">Load Chart</button>
    </section>

    <section class="status">
      <div id="message">Loading stock list...</div>
    </section>

    <section class="chart-section">
      <div id="chart"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
